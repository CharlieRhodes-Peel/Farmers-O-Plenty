# Forge 1.20.1 metadata. The NeoForge equivalent is templates/neoforge/META-INF/neoforge.mods.toml;
# keep the descriptive fields of the two in sync.
# Find more information on the format here: https://docs.minecraftforge.net/en/1.20.x/gettingstarted/modfiles/

modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
authors="Milkski"
description='''
A Compatibility Mod For Farmer's Delight and Biomes O' Plenty that adds new recipes to Farmer's Delight
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${loader_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
