# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03
# Environment Properties
# You can find the latest versions here: https://files.minecraftforge.net/net/minecraftforge/forge/index_1.20.1.html
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
forge_version=47.4.28
# The loader version range can only use the major version of Forge as bounds
loader_version_range=[47,)

## Dependencies (Forge 1.20.1 builds, from Modrinth)
# Biomes O' Plenty 19.0.0.96 + its dependencies TerraBlender 3.0.1.11 and GlitchCore 0.0.1.1
deps.biomesoplenty=maven.modrinth:biomes-o-plenty:jxUqRzSD
deps.terrablender=maven.modrinth:terrablender:IfcgopfA
deps.glitchcore=maven.modrinth:glitchcore:pYPZ5MNI
# Farmer's Delight 1.20.1-1.3.4
deps.farmersdelight=maven.modrinth:farmers-delight:SiIpcZzM
# JEI 15.59.0.212 (newer 1.20.1 builds also need the separate MezzConfig mod)
deps.jei=maven.modrinth:jei:IrfJO7PN

# Minimum dependency versions written into the mods.toml (the versions we build and test against).
# Older BOP builds may be missing items we use (e.g. white_lavender), so Forge/NeoForge will show a
# clear "update Biomes O' Plenty" screen instead of crashing.
bop_version_range=[19.0.0.96,)
fd_version_range=[1.20.1-1.3.4,)
